<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CalmFrame overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* The capture feeds the frame callback; it must stay in the page but not be seen. */
      #capture {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <video id="capture" muted playsinline></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
