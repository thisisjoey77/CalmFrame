<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CalmFrame</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      /* A small frameless panel (redesigned Sat Nov 14, afternoon). Calm on purpose: dark,
         muted, high-contrast text, no transitions or animation anywhere except the graph's
         scrolling. It sits above the overlay and is not smoothed, so nothing in it may
         blink. Status colours are close in brightness and none is a saturated red. */
      :root {
        color-scheme: dark;
        --bg: #14181d;
        --panel: #1c2128;
        --border: #30363d;
        --text: #f0f3f6;
        --muted: #c3cad2;
        --protected: #3fb950;
        --smoothing: #58a6ff;
        --off: #d29922;
        --warn-bg: #3a2c0b;
        --warn-text: #f2d17c;
        --focus: #f0f3f6;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.4;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        transition: none !important;
        animation: none !important;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        /* The window is fitted to the panel's height, so nothing should ever scroll. */
        overflow: hidden;
        user-select: none;
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Header: the drag handle of the frameless window. */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px 10px 14px;
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        app-region: drag;
      }
      header button {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      /* The small status mark: a filled disc with a tick, a disc with a wave, or a slashed
         ring, so it reads without colour too (the tray icon's shapes). */
      #mark {
        width: 22px;
        height: 22px;
        flex: none;
      }
      #mark.protected {
        color: var(--protected);
      }
      #mark.smoothing {
        color: var(--smoothing);
      }
      #mark.off {
        color: var(--off);
      }
      #mark .shape {
        display: none;
      }
      #mark.protected .protected,
      #mark.smoothing .smoothing,
      #mark.off .off {
        display: inline;
      }

      /* The protection switch. */
      #protection {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: transparent;
        border: 2px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px 4px 4px;
        cursor: pointer;
      }
      #protection .track {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        background: #3b434c;
        position: relative;
      }
      #protection .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--text);
      }
      #protection[aria-checked='true'] .track {
        background: var(--protected);
      }
      #protection[aria-checked='true'] .knob {
        left: 21px;
      }
      #protection-label {
        min-width: 2ch;
      }

      /* The one notice line, only when something is wrong. */
      #notice {
        margin: 0;
        padding: 8px 14px;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
      }
      #notice.problem {
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      #notice.info {
        background: var(--panel);
        color: var(--muted);
      }

      section {
        padding: 12px 14px;
      }
      section + section {
        border-top: 1px solid var(--border);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      h2,
      label {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .value {
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        text-align: right;
      }

      #rate {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      #rate-value {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
      }
      #graph {
        display: block;
        width: 100%;
        height: 96px;
        margin-top: 6px;
        border-radius: 6px;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input[type='range'] {
        width: 100%;
        margin: 8px 0 2px;
        accent-color: var(--smoothing);
      }
      .scale {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main id="panel">
      <header>
        <svg id="mark" class="off" viewBox="0 0 64 64" aria-hidden="true">
          <g class="shape protected">
            <circle cx="32" cy="32" r="28" fill="currentColor" />
            <path
              d="M19 33 l9 9 l17 -19"
              fill="none"
              stroke="#14181d"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
          <g class="shape smoothing">
            <circle cx="32" cy="32" r="28" fill="currentColor" />
            <path
              d="M14 34 C 20 24, 26 24, 32 32 S 44 40, 50 30"
              fill="none"
              stroke="#14181d"
              stroke-width="7"
              stroke-linecap="round"
            />
          </g>
          <g class="shape off">
            <circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="7" />
            <path d="M14 50 L50 14" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
          </g>
        </svg>
        <h1>CalmFrame</h1>
        <span id="status-text" class="visually-hidden" aria-live="polite">Protection off</span>
        <button
          id="protection"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Protection"
        >
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
          <span id="protection-label" aria-hidden="true">Off</span>
        </button>
      </header>

      <p id="notice" role="status" hidden></p>

      <section aria-labelledby="rate-title">
        <div class="row">
          <h2 id="rate-title">Flashes per second</h2>
          <p id="rate"><strong id="rate-value">0</strong> / sec</p>
        </div>
        <canvas
          id="graph"
          role="img"
          aria-label="Scrolling graph of flashes per second over the most affected area of the screen, with a dashed line at the flash limit"
        ></canvas>
      </section>

      <section class="controls" aria-label="Settings">
        <div>
          <div class="row">
            <label for="sensitivity">Sensitivity</label>
            <span id="sensitivity-name" class="value"></span>
          </div>
          <input
            id="sensitivity"
            type="range"
            min="0"
            max="3"
            step="1"
            value="1"
            aria-describedby="sensitivity-desc"
          />
          <div class="scale" aria-hidden="true"><span>More sensitive</span><span>Strict</span></div>
          <span id="sensitivity-desc" class="visually-hidden"></span>
        </div>
        <div>
          <div class="row">
            <label for="flash-limit">Flash limit</label>
            <span id="flash-limit-name" class="value"></span>
          </div>
          <input id="flash-limit" type="range" min="3" max="10" step="1" value="3" />
          <div class="scale" aria-hidden="true">
            <span id="flash-limit-min">3</span><span id="flash-limit-max">10</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
